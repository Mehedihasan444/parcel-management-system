name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch instead of queueing them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The route-contract test and the secret audit both need the full
          # history, not a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Check relative imports resolve
        run: npm run check:imports

      - name: Check documentation links and commands
        run: npm run check:docs

      - name: Build, lint, typecheck and test
        run: npx turbo run build test lint typecheck

      - name: Audit history for secrets
        run: npm run audit:secrets

      - name: Upload build artefacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
          if-no-files-found: ignore
